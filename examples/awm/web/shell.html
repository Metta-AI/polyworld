<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWM — Archers Warriors Mages</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171c23; color: #f2e1bf; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: #171c23; font: 16px/1.6 system-ui, sans-serif; }
    #loading h1 { margin: 0 0 12px; font: 600 48px Georgia, serif; letter-spacing: .12em; }
    #loading p { margin: 0; white-space: pre-wrap; max-width: min(600px, 85vw); }
    #game-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #loading.error { background: #271b1b; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="AWM game" oncontextmenu="event.preventDefault()"></canvas>
  <p id="game-status" role="status" aria-live="polite"></p>
  <div id="loading" role="status"><h1>AWM</h1><p id="status">Loading Archers Warriors Mages…</p></div>
  <script>
    var canvas = document.getElementById("canvas");
    var loading = document.getElementById("loading");
    var statusText = document.getElementById("status");
    function reportError(message) {
      loading.hidden = false;
      loading.style.display = "grid";
      loading.classList.add("error");
      statusText.textContent = "AWM could not start.\n" + message;
    }
    canvas.addEventListener("webglcontextlost", function (event) {
      event.preventDefault();
      reportError("The graphics context was lost. Reload the page to reconnect.");
    });
    var Module = {
      preRun: [], postRun: [], canvas: canvas,
      setStatus: function (text) { if (text) statusText.textContent = text; },
      monitorRunDependencies: function (left) {
        statusText.textContent = left ? "Loading game assets…" : "Preparing the game…";
      },
      onRuntimeInitialized: function () {
        loading.style.display = "none";
        canvas.focus();
      },
      onAbort: function (reason) { reportError(String(reason)); },
      printErr: function (text) {
        console.error(text);
        if (String(text).includes("unhandled exception:") || String(text).includes("Aborted(")) reportError(String(text));
      }
    };
    window.addEventListener("error", function (event) { reportError(event.message || "See the browser console for details."); });
    window.addEventListener("unhandledrejection", function (event) { reportError(String(event.reason)); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
